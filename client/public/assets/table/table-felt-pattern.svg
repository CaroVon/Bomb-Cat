<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- 主色:深赭 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#1a120c"/>
    </linearGradient>
    <!-- 麻叶金线 -->
    <pattern id="asanoha" x="0" y="0" width="40" height="34" patternUnits="userSpaceOnUse">
      <g stroke="#c6a14a" stroke-width="0.6" fill="none" opacity="0.42">
        <path d="M20 0 L0 17 L20 34 L40 17 Z"/>
        <path d="M0 17 L40 17"/>
        <path d="M20 0 L10 17 L20 34"/>
        <path d="M20 0 L30 17 L20 34"/>
      </g>
    </pattern>
    <!-- 边沿阴影 -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <!-- 细小噪点 -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 0 0.02 0 0 0 0.25 0"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#bg)"/>
  <rect width="240" height="240" fill="url(#asanoha)"/>
  <rect width="240" height="240" fill="url(#vignette)"/>
  <rect width="240" height="240" opacity="0.35" filter="url(#grain)"/>
</svg>
