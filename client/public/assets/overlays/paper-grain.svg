<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 暖白纤维 -->
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.3" numOctaves="3" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.92  0 0 0 0 0.85  0 0 0 0 0.72  0 0 0 0.85 0"/>
    </filter>
    <!-- 深色斑点 -->
    <filter id="spot" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0.18 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#f5ead0"/>
  <rect width="512" height="512" filter="url(#fiber)"/>
  <rect width="512" height="512" filter="url(#spot)"/>
</svg>
